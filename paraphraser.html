<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: إعادة الصياغة الخارقة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#B45309;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#B45309;margin-bottom:1rem;border-bottom:2px solid #FEF3C7;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#B45309;box-shadow:0 0 0 3px rgba(180,83,9,0.1)}
textarea{resize:vertical;min-height:150px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#B45309;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#92400E}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#B45309}
.copy-btn{background:#FEF3C7;color:#B45309;border:1px solid #B45309;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>إعادة الصياغة الأكاديمية الخارقة (De-AI)</h1>
    <p class="subtitle">تحويل النصوص إلى أسلوب بشري رصين ومحصّن ضد كواشف الذكاء الاصطناعي</p>
  </header>

  <div class="card">
    <div class="section-title">1. النص المستهدف</div>
    <div class="form-group">
      <label>الصق الفقرة هنا</label>
      <textarea id="textToRewrite" placeholder="الصق هنا الفقرة التي تريد إعادة صياغتها..."></textarea>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="Arabic">عربية فصحى أكاديمية</option>
          <option value="French">فرنسية أكاديمية</option>
        </select>
      </div>
      <div class="form-group">
        <label>مستوى التعديل (عمق إعادة البناء)</label>
        <select id="level">
          <option value="Light touch: Fix awkward phrasing and remove obvious AI signatures while preserving original sentence structure.">تعديل خفيف (تصحيح الصياغة)</option>
          <option value="Moderate rewrite: Vary sentence structure significantly (mix short and long sentences) and remove all AI signatures.">تعديل متوسط (تنويع الجمل)</option>
          <option value="Deep rewrite: Completely restructure the paragraph with a new argumentative flow, changing vocabulary for scholarly precision.">تعديل جذري (إعادة بناء الفقرة)</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد برومبت إعادة الصياغة</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const textToRewrite = document.getElementById('textToRewrite').value || '[Insert Text Here]';
    const lang = document.getElementById('lang').value;
    const level = document.getElementById('level').value;

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Academic Editor with 20+ years of experience editing for top-tier Q1 journals. You have an exceptional eye for detecting and eliminating AI-generated cadence, ensuring the prose is indistinguishable from human expert writing.

=====================================================================
TASK SPECIFICATION
=====================================================================
Rewrite the provided text to make it academically rigorous and free of AI signatures. 
TARGET LANGUAGE: ${lang}
REWRITE LEVEL: ${level}

TEXT TO REWRITE:
"""
${textToRewrite}
"""

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================

1. RHYTHM & CADENCE (The "Syncopated" Rule):
   - Eliminate the uniform AI rhythm. 
   - Deliberately alternate between very short, punchy sentences (6–10 words) and long, complex subordinate clauses (30–45 words).
   - Do NOT start consecutive sentences with the same grammatical structure (e.g., avoid "The results show... The data indicate...").
   - Ensure the paragraph flows with a human-like, logical progression of ideas.

2. BANNED PHRASES (AI Fingerprints — YOU MUST AVOID):
   - "It is worth noting that", "In conclusion", "Importantly", "Delve into", "Shed light on", "Multifaceted", "Tapestry", "Paradigm shift", "Holistic approach", "Furthermore" (as a paragraph opener), "This paper aims to", "In today's rapidly changing world", "With the advent of...", "It is crucial to".
   - Never use ornamental em-dashes (—) or gratuitous semicolons (;).

3. VOCABULARY & TONE:
   - Maintain a precise, authoritative, and analytical scholarly register.
   - Replace generic AI verbs (e.g., "explore", "delve") with precise academic verbs (e.g., "examine", "interrogate", "elucidate").
   - Ensure every concept is operationalized at first use (no vague abstractions).

4. LEXICAL ECONOMY:
   - Remove all throat-clearing phrases (e.g., "It is important to consider...").
   - Every word must earn its place.

=====================================================================
OUTPUT INSTRUCTIONS
=====================================================================
- Provide ONLY the rewritten text. 
- Do NOT include any preamble, meta-commentary, or explanations (e.g., do not say "Here is the rewritten text:"). 
- Just output the final, polished paragraph(s).
- Begin immediately with the first word of the text.`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
