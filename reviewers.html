<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: الرد على المحكمين الخارق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#0284C7;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#0284C7;margin-bottom:1rem;border-bottom:2px solid #E0F2FE;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#0284C7;box-shadow:0 0 0 3px rgba(2,132,199,0.1)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#0284C7;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#0369A1}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#0284C7}
.copy-btn{background:#E0F2FE;color:#0284C7;border:1px solid #0284C7;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>صانع الرد على المحكمين</h1>
    <p class="subtitle">صياغة ردود أكاديمية خارقة ومهذبة لملاحظات المراجعين (Q1)</p>
  </header>

  <div class="card">
    <div class="section-title">1. ملاحظة المحكم</div>
    
    <div class="form-group">
      <label>نص ملاحظة المحكم (Reviewer Comment)</label>
      <textarea id="reviewerComment" placeholder="مثال: The authors failed to adequately address the issue of endogeneity in their regression model. Furthermore, the literature review is outdated..."></textarea>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>موقفك من الملاحظة</label>
        <select id="action">
          <option value="Accepted: We fully agree with the reviewer and have made the requested changes.">قبلت الملاحظة (وقمت بالتعديل)</option>
          <option value="Partially Accepted: We agree with the core concern but have taken a different (justified) methodological approach.">قبلت جزئياً (بتبرير منهجي)</option>
          <option value="Respectfully Declined: We appreciate the comment but believe the current approach is justified for the following reasons...">رفضت الملاحظة بأدب (مع تقديم تبرير)</option>
        </select>
      </div>
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="Arabic">عربية فصحى أكاديمية</option>
          <option value="French">فرنسية أكاديمية</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>ماذا فعلت بالضبط؟ (اختياري - لكنه مهم جداً)</label>
      <textarea id="myAction" rows="3" placeholder="مثال: أضفت اختبار Hausman، وأضفت 5 دراسات جديدة في مراجعة الأدبيات (صفحة 4، الفقرة 2)..."></textarea>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد برومبت الرد الخارق</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const comment = document.getElementById('reviewerComment').value || '[Insert Reviewer Comment]';
    const action = document.getElementById('action').value;
    const lang = document.getElementById('lang').value;
    const myAction = document.getElementById('myAction').value || '[Explain what you changed in the manuscript]';

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Academic Editor and Lead Author with 20+ years of experience navigating the peer-review process for top-tier Q1 journals. You possess exceptional diplomatic skills, methodological rigor, and the ability to craft persuasive, evidence-based responses that satisfy reviewers without compromising the authors' scientific integrity.

=====================================================================
TASK SPECIFICATION
=====================================================================
Draft a formal "Response to Reviewer" letter based on the provided information.
TARGET LANGUAGE: ${lang}

REVIEWER COMMENT:
"""
${comment}
"""

AUTHOR'S STANCE: ${action}
AUTHOR'S ACTION TAKEN IN MANUSCRIPT: ${myAction}

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================

1. RHYTHM & CADENCE: 
   - Eliminate any uniform AI rhythm. Alternate between short, direct sentences (asserting a point) and long, complex sentences (explaining the rationale).
   - Do NOT start consecutive sentences or paragraphs with the same structure.

2. BANNED PHRASES (AI Fingerprints — YOU MUST AVOID):
   - Never use: "It is worth noting that", "In conclusion", "Importantly", "Delve into", "Shed light on", "Multifaceted", "Tapestry", "Paradigm shift", "Holistic approach", "Furthermore" (as a paragraph opener), "This paper aims to".
   - Never use ornamental em-dashes (—) or gratuitous semicolons (;).

3. TONE & DIPLOMACY:
   - Maintain a highly professional, humble, yet authoritative tone. Never sound defensive or aggressive.
   - Acknowledge the reviewer's insight graciously.
   - If accepting the critique: clearly state the exact revisions made (e.g., "We have added a new paragraph in Section 4.2, page 15...").
   - If partially accepting or respectfully declining: provide a rigorous, literature-backed justification. Cite specific methodological references to support your stance.
   - Never use vague or evasive language. Be direct and specific.

4. STRUCTURAL PROHIBITIONS:
   - Do NOT use bullet points or numbered lists. Integrate the response into flowing, scholarly prose.
   - Do NOT include meta-commentary (e.g., "Here is a suggested response:").

=====================================================================
OUTPUT FORMAT
=====================================================================
Provide ONLY the drafted response text. 
Begin directly with: "Response to Reviewer:"
Do not add any other preamble.`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
