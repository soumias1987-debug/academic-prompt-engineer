<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: مولّد الأسئلة البحثية الخارق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#D946EF;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#D946EF;margin-bottom:1rem;border-bottom:2px solid #FAE8FF;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#D946EF;box-shadow:0 0 0 3px rgba(217,70,239,0.1)}
textarea{resize:vertical;min-height:100px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#D946EF;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#C026D3}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#D946EF}
.copy-btn{background:#FAE8FF;color:#D946EF;border:1px solid #D946EF;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>مولّد الأسئلة البحثية الخارق</h1>
    <p class="subtitle">استخراج الفجوة البحثية وصياغة أسئلة دقيقة وفق معايير FINER</p>
  </header>

  <div class="card">
    <div class="section-title">1. تفاصيل الفكرة</div>
    <div class="grid">
      <div class="form-group">
        <label>الميدان المعرفي</label>
        <select id="field">
          <option value="Political Science">العلوم السياسية</option>
          <option value="Public Administration">الإدارة العامة</option>
          <option value="International Relations">العلاقات الدولية</option>
          <option value="Sociology">علم الاجتماع</option>
        </select>
      </div>
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="Arabic">عربية فصحى</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>الموضوع العام أو المشكلة البحثية</label>
      <textarea id="topic" placeholder="مثال: أريد دراسة تأثير وسائل التواصل الاجتماعي على المشاركة السياسية للشباب في دول الخليج، لكنني لا أعرف كيف أصيغ السؤال البحثي بدقة."></textarea>
    </div>
    
    <div class="grid">
      <div class="form-group">
        <label>المنهجية المفضلة (اختياري)</label>
        <select id="method">
          <option value="Quantitative">كمي</option>
          <option value="Qualitative">نوعي</option>
          <option value="Mixed Methods">مختلط</option>
          <option value="No preference (suggest the best)">لا يوجد تفضيل</option>
        </select>
      </div>
      <div class="form-group">
        <label>هل لديك فجوة محددة تريد معالجتها؟</label>
        <input type="text" id="gap" placeholder="مثال: نقص الدراسات التي تقارن بين الفئات العمرية">
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد برومبت الأسئلة الخارق</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const field = document.getElementById('field').value;
    const topic = document.getElementById('topic').value || '[Insert General Topic]';
    const method = document.getElementById('method').value;
    const gap = document.getElementById('gap').value || 'Not specified';
    const lang = document.getElementById('lang').value;

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Academic Supervisor and Methodologist with 20+ years of experience guiding PhD students to publish in top-tier Q1 journals in ${field}. You are renowned for your ability to transform vague ideas into highly rigorous, publishable research questions.

=====================================================================
TASK SPECIFICATION
=====================================================================
The user has provided a general topic. Your task is to:
1. Identify a specific, empirically grounded research gap.
2. Generate 5 highly refined Research Questions (RQs) that strictly adhere to the FINER criteria (Feasible, Interesting, Novel, Ethical, Relevant).

USER'S GENERAL TOPIC:
"""
${topic}
"""

PREFERRED METHODOLOGY: ${method}
KNOWN GAP: ${gap}
TARGET LANGUAGE: ${lang}

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================

1. RHYTHM & CADENCE: 
   - Eliminate any uniform AI rhythm. Alternate between short, direct sentences and long, complex sentences.
   - Do NOT start consecutive sentences or paragraphs with the same structure.

2. BANNED PHRASES (AI Fingerprints — YOU MUST AVOID):
   - Never use: "It is worth noting that", "In conclusion", "Importantly", "Delve into", "Shed light on", "Multifaceted", "Tapestry", "Paradigm shift", "Holistic approach", "Furthermore" (as a paragraph opener).
   - Never use ornamental em-dashes (—) or gratuitous semicolons (;).

3. STRUCTURAL PROHIBITIONS:
   - Do NOT use bullet points or numbered lists for the RQs. Integrate them into a structured narrative paragraph for each.
   - Do NOT include meta-commentary (e.g., "Here are the research questions:").

4. TONE & VOCABULARY:
   - Maintain an authoritative, analytical, and precise tone.
   - Use field-specific terminology correctly.

=====================================================================
OUTPUT FORMAT
=====================================================================
For each of the 5 RQs, provide a single cohesive paragraph that contains:
1. The Research Question itself (clearly stated).
2. The Methodological Approach (how to answer it).
3. The Theoretical Justification (why it matters).

Do NOT write an introductory or concluding paragraph. Start directly with "Research Question 1: [text]".`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
