<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: الكمي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#185FA5;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#185FA5;margin-bottom:1rem;border-bottom:2px solid #E6F1FB;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,0.1)}
textarea{resize:vertical;min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
@media(max-width:600px){.grid, .grid-3{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#185FA5;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#0C447C}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#0F6E56}
.copy-btn{background:#E1F5EE;color:#085041;border:1px solid #0F6E56;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>مهندس البرومبت الأكاديمي: الكمي</h1>
    <p class="subtitle">توليد برومبت خارق (Master Prompt) للدراسات الكمية (Q1)</p>
  </header>

  <div class="card">
    <div class="section-title">1. هوية المقال</div>
    <div class="grid">
      <div class="form-group">
        <label>الميدان المعرفي</label>
        <select id="field">
          <option value="Political Science">العلوم السياسية</option>
          <option value="Public Administration">الإدارة العامة</option>
          <option value="International Relations">العلاقات الدولية</option>
          <option value="Sociology">علم الاجتماع</option>
        </select>
      </div>
      <div class="form-group">
        <label>نمط الاستشهاد</label>
        <select id="citation">
          <option value="APA 7th edition">APA 7th</option>
          <option value="Chicago Author-Date">Chicago</option>
          <option value="Harvard">Harvard</option>
        </select>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label>المتغير المستقل (IV)</label>
        <input type="text" id="iv" placeholder="مثال: جودة الحوكمة">
      </div>
      <div class="form-group">
        <label>المتغير التابع (DV)</label>
        <input type="text" id="dv" placeholder="مثال: ثقة المواطنين">
      </div>
      <div class="form-group">
        <label>السياق الجغرافي</label>
        <input type="text" id="geo" placeholder="مثال: دول MENA">
      </div>
    </div>

    <div class="form-group">
      <label>الفرضية أو السؤال البحثي</label>
      <textarea id="hypo" placeholder="اكتب سؤالك البحثي..."></textarea>
    </div>
  </div>

  <div class="card">
    <div class="section-title">2. المنهجية واللغة</div>
    <div class="grid">
      <div class="form-group">
        <label>نوع المنهج الكمي</label>
        <select id="method">
          <option value="multiple regression / OLS with robust standard errors">انحدار متعدد (OLS)</option>
          <option value="panel data (Fixed/Random Effects)">بيانات لوحية (Panel)</option>
          <option value="SEM (Structural Equation Modeling)">نمذجة المعادلات (SEM)</option>
        </select>
      </div>
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="Arabic">عربية فصحى</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد البرومبت الخارق</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const field = document.getElementById('field').value;
    const citation = document.getElementById('citation').value;
    const iv = document.getElementById('iv').value || '[IV]';
    const dv = document.getElementById('dv').value || '[DV]';
    const geo = document.getElementById('geo').value || '[Context]';
    const method = document.getElementById('method').value;
    const hypo = document.getElementById('hypo').value || '[Research Question]';
    const lang = document.getElementById('lang').value;

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Quantitative Researcher and published academic scholar with 15+ years of experience in ${field}.

You have published extensively in Q1-indexed journals (Web of Science / Scopus / SSCI) and are proficient in the following statistical software and methods currently required by top-tier peer reviewers:
PRIMARY TOOLS: R / RStudio, Stata 19, IBM SPSS v29 + AMOS, Python, JASP, SmartPLS 4.
ADVANCED METHODS: SEM (CB-SEM and PLS-SEM), Multilevel Modeling (HLM), Panel Data Analysis (Fixed/Random/GMM), DiD, IV Regression, Time-Series Cross-Sectional Analysis (TSCS), Mediation & Moderation Analysis, CFA.

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================
To ensure the output is indistinguishable from human scholarly writing and passes AI-detection, you MUST strictly adhere to the following:

1. RHYTHM & CADENCE: 
   - Never produce a uniform sentence length (e.g., avoid a predictable 20-25 word flow).
   - Use "Syncopated Cadence": Alternate deliberately between very short, punchy declarative sentences (6–10 words) and long, complex subordinate clauses (30–45 words) that contain multiple qualifiers.
   - Avoid starting consecutive sentences or paragraphs with the same grammatical structure (e.g., do not start multiple paragraphs with "The results show...").

2. BANNED PHRASES (AI Fingerprints):
   - Never use: "In today's rapidly changing world", "This paper seeks to delve into", "It is important to note that", "Shedding light on", "This study aims to explore", "Holistic approach", "tapestry", "landscape of research".
   - Never begin a sentence with: "In recent years...", "With the advent of...", "Furthermore,", "Moreover,", "Additionally,".
   - Avoid hedging language unless it is statistically required: (e.g., do not use "might", "could possibly", "seems to suggest").

3. VOCABULARY & TONE:
   - Maintain an authoritative, assertive, and analytical tone. You are an expert talking to peers, not a student explaining concepts.
   - Use field-specific terminology precisely (define at first use, then use consistently).
   - Do not use ornamental em-dashes (—) or gratuitous semicolons (;).

4. STRUCTURAL PROHIBITIONS:
   - Absolutely NO bullet points or numbered lists in the Results, Discussion, or Conclusion sections. All enumeration must be integrated into flowing prose.
   - Never use meta-commentary (e.g., do not write "Here is the literature review").

=====================================================================
MANDATORY PRE-WRITING PROTOCOL — DO NOT SKIP ANY PHASE
=====================================================================
Your task is to co-author a complete, publication-ready quantitative research article on: "${hypo}"

STOP after each phase and WAIT for my explicit approval before proceeding.

--- PHASE 1 — LITERATURE REVIEW & QUANTITATIVE RESEARCH GAP: ---
1. Synthesize 12–18 relevant quantitative studies. For each thematic cluster, critically analyze: statistical methods (and limitations), sample sizes, variables examined/ignored, conflicting findings.
2. Identify a SPECIFIC, EMPIRICALLY GROUNDED RESEARCH GAP (What exact relationship has NOT been tested? Which variables were omitted?).
3. Formulate a PRECISE RESEARCH QUESTION and 2–4 directional HYPOTHESES (H1, H2...) derived from theory.

--- PHASE 2 — RESEARCH DESIGN & VARIABLE OPERATIONALIZATION: ---
1. Define and operationalize ALL variables (IV: ${iv}, DV: ${dv}): Conceptual definition, Operational definition, Measurement scale, Data source.
2. Specify the STATISTICAL METHOD (${method}): Why it is appropriate, software used, Sample size justification (G*Power), Assumptions testing (normality, VIF < 5).
3. Specify DATA COLLECTION STRATEGY (${geo}): Primary or secondary? Sampling method. Reliability (Cronbach's α ≥ 0.70) and validity (AVE ≥ 0.50, HTMT < 0.85).

--- PHASE 3 — FULL ARTICLE DRAFTING: ---
[^1] ABSTRACT (250–300 words)
- Structure: Background | Objective | Method | Results | Conclusion | Keywords.
- Include specific statistical values (e.g., β = 0.42, p < .001, R² = 0.58). Do NOT start with "This paper".

[^2] INTRODUCTION (700–900 words)
- Hook: A substantive empirical puzzle or anomaly, NOT a broad declaration.
- State the gap explicitly, the research question, and hypotheses.
- End with a roadmap paragraph.

[^3] THEORETICAL FRAMEWORK & LITERATURE REVIEW (1,200–1,800 words)
- Thematic organization. Critically engage: compare effect sizes, model specifications.
- Justify the theoretical model. End with a statement of theoretical contribution.

[^4] METHODOLOGY (700–900 words)
- Research Philosophy, Design, Sampling, Measurement, Statistical Procedure (step-by-step), Assumptions Testing.

[^5] RESULTS (1,000–1,500 words)
- (a) Descriptive Statistics (Table 1). (b) Reliability & Validity (Table 2). (c) Correlation Matrix. (d) Hypothesis Testing: Report β, SE, t/z/F, p-value, 95% CI, R², Cohen's f². (e) Mediation/Moderation (bootstrap CI). 
- Reporting standard: ${citation}. Exact p-values (e.g., p = .023).

[^6] DISCUSSION (900–1,200 words)
- Interpret each finding against the hypothesis. Connect to prior studies. Explain non-significant findings (do not hide them). Theoretical contributions + Policy/practical implications.

[^7] CONCLUSION (350–500 words)
- Restate core findings (no new data). Honest methodological limitations. Specific future research directions. 

[^8] REFERENCES
- Minimum 35 sources (>70% from last 8 years). ${citation}.

=====================================================================
START NOW WITH PHASE 1 ONLY.
Produce the critical quantitative literature review and derive the research gap. 
STOP after Phase 1. Await my review and approval.
=====================================================================
Target Language: ${lang}`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
