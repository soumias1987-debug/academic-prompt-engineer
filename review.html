<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: المراجعة والببليومتري (النسخة الكاملة)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#7C3AED;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#7C3AED;margin-bottom:1rem;border-bottom:2px solid #F3E8FF;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,0.1)}
textarea{resize:vertical;min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
@media(max-width:600px){.grid, .grid-3{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#7C3AED;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#5B21B6}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#7C3AED}
.copy-btn{background:#F3E8FF;color:#7C3AED;border:1px solid #7C3AED;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>مهندس البرومبت الأكاديمي: المراجعة والببليومتري</h1>
    <p class="subtitle">النسخة الكاملة (PRISMA + Bibliometric + المزايا الخارقة)</p>
  </header>

  <div class="card">
    <div class="section-title">1. تفاصيل الدراسة</div>
    <div class="grid">
      <div class="form-group">
        <label>نوع الدراسة</label>
        <select id="studyType">
          <option value="Systematic Literature Review (PRISMA 2020 protocol)">مراجعة منهجية (Systematic Review - PRISMA)</option>
          <option value="Bibliometric Analysis (Performance Analysis & Science Mapping)">تحليل ببليومتري (Bibliometric)</option>
          <option value="Mixed-Methods Systematic Review">مراجعة منهجية مختلطة (Mixed Review)</option>
        </select>
      </div>
      <div class="form-group">
        <label>قاعدة البيانات المستخدمة</label>
        <select id="database">
          <option value="Scopus">Scopus</option>
          <option value="Web of Science (WoS)">Web of Science</option>
          <option value="Scopus and Web of Science">Scopus & WoS</option>
          <option value="PubMed, Scopus, and Web of Science">PubMed + Scopus + WoS</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>الفترة الزمنية</label>
        <input type="text" id="timeframe" placeholder="مثال: 2015 - 2024">
      </div>
      <div class="form-group">
        <label>الكلمات المفتاحية / استعلام البحث (Query)</label>
        <input type="text" id="query" placeholder='مثال: TITLE-ABS-KEY("Decentralization" AND "Governance")'>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>برنامج التحليل</label>
        <select id="software">
          <option value="VOSviewer and R (Bibliometrix package)">VOSviewer + R (Bibliometrix)</option>
          <option value="VOSviewer">VOSviewer فقط</option>
          <option value="CiteSpace">CiteSpace</option>
          <option value="NVivo (for thematic synthesis)">NVivo (للتحليل الموضوعي)</option>
        </select>
      </div>
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="Arabic">عربية فصحى</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد البرومبت الخارق</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const studyType = document.getElementById('studyType').value;
    const database = document.getElementById('database').value;
    const timeframe = document.getElementById('timeframe').value || '[Timeframe]';
    const query = document.getElementById('query').value || '[Search Query]';
    const software = document.getElementById('software').value;
    const lang = document.getElementById('lang').value;

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Academic Methodologist and published scholar with 15+ years of experience in conducting and publishing Systematic Reviews and Bibliometric Analyses in top-tier Q1 journals. You have deep expertise in PRISMA 2020 protocols, Scientometrics, and Science Mapping.

You master the following analytical software:
- Systematic Reviews: ${software}.
- Bibliometric Analysis: VOSviewer, R (Bibliometrix/Biblioshiny), CiteSpace, Gephi.

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================
To ensure the output is indistinguishable from human scholarly writing and passes AI-detection, you MUST strictly adhere to the following:

1. RHYTHM & CADENCE: 
   - Never produce a uniform sentence length.
   - Use "Syncopated Cadence": Alternate deliberately between very short, punchy declarative sentences (6–10 words) and long, complex subordinate clauses (30–45 words).

2. BANNED PHRASES (AI Fingerprints):
   - Never use: "In today's rapidly changing world", "This paper seeks to delve into", "It is important to note that", "Shedding light on", "This study aims to explore", "Holistic approach", "tapestry", "landscape of research".
   - Never begin a sentence with: "In recent years...", "With the advent of...", "Furthermore,", "Moreover,", "Additionally,".

3. VOCABULARY & TONE:
   - Maintain an authoritative, analytical, and systematic tone.
   - Use field-specific terminology precisely (e.g., "co-citation networks," "bibliometric coupling").

4. STRUCTURAL PROHIBITIONS:
   - Absolutely NO bullet points or numbered lists in the Results or Discussion sections.

=====================================================================
MANDATORY PRE-WRITING PROTOCOL — DO NOT SKIP ANY PHASE
=====================================================================
Your task is to co-author a complete, publication-ready ${studyType} article.

STOP after each phase and WAIT for my explicit approval before proceeding.

--- PHASE 1 — PROTOCOL & METHODOLOGY: ---
1. Define the REVIEW PROTOCOL: Justify the use of ${studyType}.
2. Search Strategy: Detail the Boolean query (${query}), databases (${database}), and timeframe (${timeframe}).
3. Inclusion/Exclusion Criteria: State the PICOS framework.
4. PRISMA Flow: Describe the identification, screening, eligibility, and included phases.
5. Data Extraction & Synthesis: How will the data be extracted and coded?

--- PHASE 2 — RESULTS & ANALYSIS DRAFTING: ---
1. Descriptive Statistics: Publications per year, top journals, top authors, top countries.
2. Thematic Analysis: Major themes, theoretical frameworks.
3. Bibliometric Mapping (if applicable): Co-authorship networks, co-citation analysis, keyword co-occurrence.
4. Provide a narrative that interprets the tables and figures.

--- PHASE 3 — FULL ARTICLE DRAFTING: ---
[^1] ABSTRACT (250–300 words)
- Structure: Background | Objective | Method | Results | Conclusion | Keywords.

[^2] INTRODUCTION (700–900 words)
- Hook: A substantive empirical puzzle or the fragmentation of the literature.
- State the gap and research questions (RQs).

[^3] METHODOLOGY (700–900 words)
- Protocol: ${studyType}. Search Strategy, Inclusion/Exclusion, PRISMA 2020 Flow, Data Extraction, Analysis (${software}).

[^4] RESULTS (1,200–1,800 words)
- (a) Descriptive Analysis. (b) Thematic/Content Analysis. (c) Science Mapping.

[^5] DISCUSSION (900–1,200 words)
- Interpret findings. Compare with prior reviews. Identify research gaps and propose a future research agenda.

[^6] CONCLUSION (350–500 words)
- Synthesize. Methodological limitations. Implications.

[^7] REFERENCES
- Minimum 50 sources (prioritizing Q1 journals).

=====================================================================
START NOW WITH PHASE 1 ONLY.
Produce the review protocol, search strategy, and PRISMA flow description. 
STOP after Phase 1. Await my review and approval.
=====================================================================
Target Language: ${lang}`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
