<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهندس البرومبت الأكاديمي: النوعي (النسخة الكاملة)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:26px;color:#0F6E56;margin-bottom:0.5rem}
p.subtitle{color:#64748b;font-size:15px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.04);padding:2rem;margin-bottom:1.5rem;border:1px solid #e2e8f0}
.section-title{font-size:16px;font-weight:700;color:#0F6E56;margin-bottom:1rem;border-bottom:2px solid #E1F5EE;padding-bottom:0.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text], select, textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s}
input[type=text]:focus, select:focus, textarea:focus{border-color:#0F6E56;box-shadow:0 0 0 3px rgba(15,110,86,0.1)}
textarea{resize:vertical;min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
@media(max-width:600px){.grid, .grid-3{grid-template-columns:1fr}}

.btn{width:100%;padding:14px;background:#0F6E56;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;margin-top:1rem}
.btn:hover{background:#085041}

.output-box{margin-top:2rem;display:none;background:#fff;border-radius:12px;padding:2rem;border:1px solid #e2e8f0}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.output-title{font-weight:bold;color:#0F6E56}
.copy-btn{background:#E1F5EE;color:#085041;border:1px solid #0F6E56;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
pre{background:#1e293b;color:#e2e8f0;padding:1.5rem;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;max-height:500px;overflow-y:auto}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>مهندس البرومبت الأكاديمي: النوعي</h1>
    <p class="subtitle">النسخة الكاملة (جميع الحقول والمناهج + المزايا الخارقة)</p>
  </header>

  <div class="card">
    <div class="section-title">1. هوية المقال</div>
    <div class="grid">
      <div class="form-group">
        <label>الميدان المعرفي</label>
        <select id="field">
          <option value="Political Science">العلوم السياسية</option>
          <option value="Public Administration">الإدارة العامة</option>
          <option value="International Relations">العلاقات الدولية</option>
          <option value="Sociology">علم الاجتماع</option>
          <option value="Education">علوم التربية</option>
        </select>
      </div>
      <div class="form-group">
        <label>نمط الاستشهاد</label>
        <select id="citation">
          <option value="APA 7th edition">APA 7th</option>
          <option value="Chicago Author-Date">Chicago</option>
          <option value="Harvard">Harvard</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>الظاهرة / المفهوم محل الاهتمام</label>
        <input type="text" id="phenom" placeholder="مثال: تجربة المواطنين مع اللامركزية">
      </div>
      <div class="form-group">
        <label>المشاركون والسياق</label>
        <input type="text" id="participants" placeholder="مثال: 25 موظفًا بلديًا في تونس">
      </div>
    </div>

    <div class="form-group">
      <label>الفرضية أو السؤال البحثي</label>
      <textarea id="hypo" placeholder="اكتب سؤالك البحثي..."></textarea>
    </div>
    <div class="form-group">
      <label>الإطار النظري / المفاهيم المحسسة (اختياري)</label>
      <input type="text" id="theory" placeholder="مثال: Grounded Theory, Reflexivity">
    </div>
  </div>

  <div class="card">
    <div class="section-title">2. المنهجية واللغة</div>
    <div class="grid">
      <div class="form-group">
        <label>نوع المنهج النوعي (كل الخيارات)</label>
        <select id="method">
          <option value="phenomenology — in-depth interviews, Colaizzi/van Manen analysis, bracketing">الظواهرية (Phenomenology)</option>
          <option value="grounded theory — open/axial/selective coding, theoretical saturation">النظرية المجذرة (Grounded Theory)</option>
          <option value="multiple case study — replication logic, cross-case synthesis">دراسة الحالة (Case Study)</option>
          <option value="ethnography — prolonged engagement, participant observation, field notes">الإثنوغرافيا (Ethnography)</option>
          <option value="reflexive thematic analysis (Braun & Clarke) — six-phase coding">التحليل الموضوعي (Thematic Analysis)</option>
          <option value="critical discourse analysis — Fairclough three-dimensional model">تحليل الخطاب النقدي (CDA)</option>
          <option value="narrative inquiry — restorying, three-dimensional space">البحث السردي (Narrative)</option>
        </select>
      </div>
      <div class="form-group">
        <label>لغة المخرج</label>
        <select id="lang">
          <option value="English">إنجليزية أكاديمية</option>
          <option value="French">فرنسية أكاديمية</option>
          <option value="Arabic">عربية فصحى</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">توليد البرومبت الخارق</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title">البرومبت جاهز للنسخ</span>
      <button class="copy-btn" id="copyBtn">نسخ النص</button>
    </div>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const field = document.getElementById('field').value;
    const citation = document.getElementById('citation').value;
    const phenom = document.getElementById('phenom').value || '[Phenomenon]';
    const participants = document.getElementById('participants').value || '[Participants]';
    const hypo = document.getElementById('hypo').value || '[Research Question]';
    const theory = document.getElementById('theory').value;
    const method = document.getElementById('method').value;
    const lang = document.getElementById('lang').value;

    const prompt = `=====================================================================
IDENTITY & EXPERTISE
=====================================================================
You are a Senior Qualitative Researcher and published academic scholar with 15+ years of experience in ${field}. You have an extensive publication record in Q1-indexed journals and deep familiarity with qualitative paradigms.

You master the following qualitative designs and analytical software:
- Designs: ${method}.
- Qualitative Data Analysis Software (CAQDAS): NVivo, MAXQDA, Atlas.ti.

=====================================================================
HUMAN AUTHENTICITY & STYLE CONSTRAINTS (ZERO TOLERANCE)
=====================================================================
To ensure the output is indistinguishable from human scholarly writing and passes AI-detection, you MUST strictly adhere to the following:

1. RHYTHM & CADENCE: 
   - Never produce a uniform sentence length.
   - Use "Syncopated Cadence": Alternate deliberately between very short, punchy declarative sentences (6–10 words) and long, complex subordinate clauses (30–45 words).
   - Avoid starting consecutive sentences or paragraphs with the same grammatical structure.

2. BANNED PHRASES (AI Fingerprints):
   - Never use: "In today's rapidly changing world", "This paper seeks to delve into", "It is important to note that", "Shedding light on", "This study aims to explore", "Holistic approach", "tapestry", "landscape of research".
   - Never begin a sentence with: "In recent years...", "With the advent of...", "Furthermore,", "Moreover,", "Additionally,".

3. VOCABULARY & TONE:
   - Maintain an authoritative, reflexive, and interpretive tone.
   - Use field-specific terminology precisely.
   - Do not use ornamental em-dashes (—) or gratuitous semicolons (;).

4. STRUCTURAL PROHIBITIONS:
   - Absolutely NO bullet points or numbered lists in the Findings, Discussion, or Conclusion sections. All enumeration must be integrated into flowing prose.

=====================================================================
MANDATORY PRE-WRITING PROTOCOL — DO NOT SKIP ANY PHASE
=====================================================================
Your task is to co-author a complete, publication-ready qualitative research article on: "${hypo}"

STOP after each phase and WAIT for my explicit approval before proceeding.

--- PHASE 1 — LITERATURE REVIEW & QUALITATIVE GAP: ---
1. Synthesize 12–18 relevant qualitative studies. Critically analyze: methodological gaps, geographical blind spots, and conceptual under-theorization.
2. Identify a SPECIFIC, EMPIRICALLY GROUNDED RESEARCH GAP.
3. Formulate a PRECISE RESEARCH QUESTION.

--- PHASE 2 — RESEARCH DESIGN & TRUSTWORTHINESS: ---
1. Define and operationalize the phenomenon (${phenom}) and participants (${participants}).
2. Specify the QUALITATIVE METHODOLOGY (${method}).
3. Specify TRUSTWORTHINESS STRATEGY: Credibility, Transferability, Dependability, Confirmability, and Researcher Positionality.

--- PHASE 3 — FULL ARTICLE DRAFTING: ---
[^1] ABSTRACT (250–300 words)
- Structure: Background | Objective | Method | Findings (Themes) | Conclusion | Keywords.
- Do NOT start with "This paper".

[^2] INTRODUCTION (700–900 words)
- Hook: A striking contextual detail or a lived phenomenon.
- State the gap, the research question, and roadmap.

[^3] THEORETICAL FRAMEWORK & LITERATURE REVIEW (1,200–1,800 words)
- Thematic organization. Present sensitizing concepts${theory ? ' ('+theory+')' : ''}.

[^4] METHODOLOGY (700–900 words)
- Philosophy, Design, Sampling, Data Collection, Analysis, Trustworthiness, Ethics, Positionality.

[^5] FINDINGS / RESULTS (1,000–1,500 words)
- Present 3–5 themes. For each theme: (a) name and define, (b) verbatim quotations (with codes e.g., P07), (c) interpret. Do NOT report statistics.

[^6] DISCUSSION (900–1,200 words)
- Interpret each theme against the framework. Compare with prior studies.

[^7] CONCLUSION (350–500 words)
- Synthesize the argument. Contributions, limitations, future research.

[^8] REFERENCES
- Minimum 35 sources. ${citation}.

=====================================================================
START NOW WITH PHASE 1 ONLY.
Produce the critical qualitative literature review and derive the research gap. 
STOP after Phase 1. Await my review and approval.
=====================================================================
Target Language: ${lang}`;

    document.getElementById('resultText').textContent = prompt;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({behavior: 'smooth'});
});

document.getElementById('copyBtn').addEventListener('click', function() {
    const text = document.getElementById('resultText').textContent;
    if (!text) return;
    
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => btn.textContent = 'نسخ النص', 2000);
    });
});
</script>

</body>
</html>
